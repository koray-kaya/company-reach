# The check AGENTS.md already promised: "main via short-lived branch → PR →
# review → merge". Until now nothing ran the tests on a pull request, so
# whether they passed depended on somebody having run them by hand.
#
# No secrets and no services. The suite takes about thirty seconds, offline;
# the only tests it skips are the golden evaluations, which are opt-in
# behind RUN_LLM_EVALS because they call a paid endpoint and are not
# deterministic. The one step that goes online is the dependency audit,
# which asks PyPI's advisory database about the locked versions.
#
# Actions are pinned to the commit of a release, its tag in the comment.
# setup-uv publishes no major tags since v8 (its releases are immutable
# instead), and a commit cannot be moved under us the way a tag can. This
# workflow is handed no secrets and publishes nothing, so the blast radius
# of a bad action is a failed build. Checked on GitHub 2026-09-25: checkout
# v7.0.1 and setup-uv v10.2.0 are the latest releases. The audit found the
# v4 and v6 used before declaring Node 20, which GitHub has retired.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung test or a stalled download fails in minutes, not after the
    # six hours GitHub allows by default.
    timeout-minutes: 15
    steps:
      # The whole history, not the default single commit: the privacy check
      # below has to see every commit ever made, not only the last one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Company and person data lives in data/, which is gitignored. This
      # proves it never slipped in, in any commit on any branch (audit:252).
      - name: data/ was never committed
        run: |
          if git log --all --name-only --format= | grep -q '^data/'; then
            echo "::error::a file under data/ is in the git history"
            git log --all --name-only --format='%h %s' | grep -B1 '^data/'
            exit 1
          fi

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # --locked fails rather than silently resolving something new, so a
      # green build means the lockfile really describes what was tested.
      - name: install
        run: uv sync --locked

      # Known vulnerabilities in every locked dependency, the dev tools
      # included. The export pins each version with its hashes, so pip-audit
      # checks exactly what `uv sync` installed and resolves nothing itself.
      - name: dependency audit
        run: |
          uv export --frozen --format requirements-txt --no-emit-project \
            --all-groups -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --require-hashes \
            -r "$RUNNER_TEMP/requirements.txt"

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: tests
        run: uv run pytest -q
