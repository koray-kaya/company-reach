# The search engine this project depends on. Start it with:
#
#     docker compose up -d searxng
#     curl 'http://127.0.0.1:8080/search?q=test&format=json'
#
# The port is published on the loopback interface only: not reachable from
# outside this machine, and it is what the tool, run under `uv` on the host,
# reaches as SEARXNG_URL (http://127.0.0.1:8080, the default).
#
# SearXNG is the only container. Every command, the review page included
# (`uv run company-reach review`), runs under `uv` on the host: the page and
# the CLI share one SQLite file in WAL mode, and SQLite requires every
# process using such a file to be on the same host — which a container
# across Docker Desktop's VM boundary is not (decided 2026-09-25).

services:
  searxng:
    # Pinned: an engine's parser changing under us would look like a bug in
    # our own code, and a dated tag makes that visible in a diff.
    image: docker.io/searxng/searxng:2026.9.20-2e624bed4
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_BASE_URL=http://localhost:8080/
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped
    # The official template also runs valkey for the rate limiter. The
    # limiter is off (see searxng/settings.yml), so it would be a container
    # doing nothing.
