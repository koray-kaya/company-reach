# The app and its search engine. `docker compose up` serves the review page
# (M7); `docker compose run --rm app run ...` executes a pipeline run.
#
# SearXNG's port is published on the loopback interface only. It is not
# reachable from outside this machine, and publishing it is what lets the app
# be developed with `uv run` against the same instance the container uses —
# without it, SEARXNG_URL would have to differ between the two.

services:
  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - searxng

  searxng:
    # Pinned: an engine's parser changing under us would look like a bug in
    # our code, and a dated tag makes that visible in a diff.
    image: docker.io/searxng/searxng:2026.9.1-9c7c2e2
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_BASE_URL=http://localhost:8080/
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    # The official template also runs valkey for the rate limiter. The
    # limiter is off, so it would be a container doing nothing.
