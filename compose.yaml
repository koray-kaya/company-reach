# The search engine this project depends on. Start it with:
#
#     docker compose up -d searxng
#     curl 'http://127.0.0.1:8080/search?q=test&format=json'
#
# The port is published on the loopback interface only: not reachable from
# outside this machine, and publishing it is what lets the app run under
# `uv run` against the same instance a container would use. Without it,
# SEARXNG_URL would have to differ between the two.
#
# The review page (M7) is the `app` service:
#
#     docker compose up -d app
#     open http://127.0.0.1:8000/
#
# `playwright` (an optional fallback, only if the JavaScript counter ever
# says we need one) joins this file when its Dockerfile exists.

services:
  searxng:
    # Pinned: an engine's parser changing under us would look like a bug in
    # our own code, and a dated tag makes that visible in a diff.
    image: docker.io/searxng/searxng:2026.9.20-2e624bed4
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_BASE_URL=http://localhost:8080/
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped
    # The official template also runs valkey for the rate limiter. The
    # limiter is off (see searxng/settings.yml), so it would be a container
    # doing nothing.

  app:
    build: .
    # Inside the container uvicorn binds 0.0.0.0 (see the Dockerfile); this
    # publishes it on the host's loopback only (audit:226). The page reads
    # and writes data/, reads the profile, and takes SENDING_APPROVED and the
    # model settings from .env. None of them is in the image.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./profile.toml:/app/profile.toml:ro
    restart: unless-stopped
