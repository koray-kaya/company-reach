<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ question }} · {{ card.name }}</title>
<link rel="stylesheet" href="/static/review.css">
</head>
<body style="overflow:auto">
<main style="max-width:640px;margin:48px auto;padding:0 16px">
  <p class="label">{{ question }}</p>
  <h1 class="name">{{ card.name }}</h1>
  <p class="what">{{ explanation }}</p>
  <form method="post" action="/decide/{{ run_id }}/{{ card.uid }}?n={{ n }}" style="margin-top:20px;display:flex;gap:10px">
    <input type="hidden" name="confirm" value="yes">
    {% for name, value in hidden.items() %}<input type="hidden" name="{{ name }}" value="{{ value }}">
    {% endfor %}
    <button class="btn primary" name="action" value="{{ action }}">{{ label }}</button>
    <a class="btn" href="/review/{{ run_id }}/{{ n }}">Cancel</a>
  </form>
</main>
</body>
</html>
