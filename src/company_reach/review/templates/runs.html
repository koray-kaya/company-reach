<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runs to review</title>
<link rel="stylesheet" href="/static/review.css">
</head>
<body style="overflow:auto">
<main style="max-width:640px;margin:48px auto;padding:0 16px">
  <p class="label">Runs to review</p>
  {% for run in runs %}
  <p class="person" style="margin-top:12px"><a href="/review/{{ run.run_id }}">{{ run.run_id }}</a>
    <span class="src">{{ run.companies }} companies · {{ run.to_send or 0 }} to send · {{ run.finished[:10] }}</span></p>
  {% else %}
  <p class="empty">No run has results yet. Draw a batch with <code>company-reach run</code>.</p>
  {% endfor %}
</main>
</body>
</html>
